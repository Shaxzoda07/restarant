services:
  - type: web
    name: novza-restaurant
    runtime: python
    plan: free
    buildCommand: "./build.sh"
    startCommand: "gunicorn novza.wsgi:application"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: DEBUG
        value: "0"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_USERNAME
        value: admin
      - key: ADMIN_PASSWORD
        sync: false
      - key: DATABASE_URL
        fromDatabase:
          name: novza-db
          property: connectionString

databases:
  - name: novza-db
    plan: free
